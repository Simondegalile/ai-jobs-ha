apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-jobs
  namespace: ai-jobs
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ai-jobs
  template:
    metadata:
      labels:
        app: ai-jobs
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["ai-jobs"]
      containers:
        - name: web
          image: ai-jobs-dashboard:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: ai-jobs-config
                  key: CLUSTER_NAME
            - name: APP_TITLE
              valueFrom:
                configMapKeyRef:
                  name: ai-jobs-config
                  key: APP_TITLE
            - name: EXAMPLE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-jobs-secret
                  key: EXAMPLE_TOKEN
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
