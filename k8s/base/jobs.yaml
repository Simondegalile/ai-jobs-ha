apiVersion: batch/v1
kind: Job
metadata:
  name: csv-check
  namespace: ai-jobs
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: check
          image: busybox:1.36
          command: ["sh", "-c", "echo batch termine; date"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: health-report
  namespace: ai-jobs
spec:
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: report
              image: curlimages/curl:8.8.0
              command: ["sh", "-c", "curl -s http://ai-jobs/health; echo"]
